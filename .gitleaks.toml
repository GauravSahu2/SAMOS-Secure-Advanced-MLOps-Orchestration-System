# ================================================================================
# SAMOS: .gitleaks.toml
# Secret Scanning Configuration (High-Assurance)
# NOTE: Gitleaks' built-in ruleset covers all common secret patterns
#       (API keys, tokens, private keys, etc.). Only add custom rules
#       for SAMOS-specific secret formats that aren't covered by defaults.
# ================================================================================

[allowlist]
description = "Allowlist for known-safe placeholders and non-sensitive public values"

regexes = [
    # Model integrity hash — public content-addressed SHA256
    'ef9386625abc8feb45ba298ab6e02c05d02418bd38e5e7437f4904b6ce82c7f2',

    # GitHub Actions secrets interpolation syntax — not a real secret
    '(?i)\$\{\{\s*secrets\.[a-zA-Z0-9_]+\s*\}\}',

    # Explicit placeholder values that are safe-by-design
    '(?i)(hf_YOUR_TOKEN_HERE|your_sonarcloud_token|your_codecov_token|your_sonar_token)',
    '(?i)(change_me_to_a_random_32char_string|change_me_on_first_login)',
    '(?i)(change_this_strong_password_123|YOUR_UPSTASH_PASSWORD|YOUR_DAGSHUB_TOKEN)',
    '(?i)(YOUR_USERNAME|YourHFUsername)',
]

# ── Path-level exclusions ─────────────────────────────────────────────────────
# These files are either example templates or internal config — never real creds.
paths = [
    '''(^|/)\.env\.example$''',
    '''(^|/)env\.example$''',
    '''(^|/)\.gitleaks\.toml$''',
    '''(^|/)sonar-project\.properties$''',
]

# ── SAMOS-specific custom rules ───────────────────────────────────────────────
# Built-in Gitleaks rules cover: AWS keys, GCP, HuggingFace tokens, GitHub PATs,
# generic high-entropy strings, etc. Only add rules for formats NOT in the default set.

[[rules]]
id = "paseto-key"
description = "SAMOS High-Assurance PASETO v4 Public Key"
regex = '''v4\.public\.[A-Za-z0-9_-]{86}'''
severity = "critical"
